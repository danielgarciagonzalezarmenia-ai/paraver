name: Build iOS (IPA sin firmar)

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Versión de Flutter a usar"
        required: false
        default: "3.41.9"
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.41.9' }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compilar app sin firmar
        run: flutter build ios --release --no-codesign

      - name: Empaquetar IPA sin firmar
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry ../ParaVer-unsigned.ipa Payload
          cd ../..
          ls -lh build/ParaVer-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParaVer-unsigned-ipa
          path: build/ParaVer-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publicar IPA en la Release del tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "ParaVer $GITHUB_REF_NAME" \
                 --notes "IPA sin firmar para instalar con Sideloadly o AltStore usando un Apple ID gratuito."
          gh release upload "$GITHUB_REF_NAME" \
            "build/ParaVer-unsigned.ipa#ParaVer-unsigned.ipa" \
            --clobber
